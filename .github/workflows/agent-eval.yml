name: Agent Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      STEAM_API_KEY: eval-fixture-key
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require paid evaluation credential
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is required because every PR runs the paid Agent gate."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: steam_agent/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r steam_agent/requirements.txt

      - name: Validate datasets
        run: python -m evals.cli validate

      - name: Audit evaluation coverage
        run: python -m evals.cli audit-coverage

      - name: Run deterministic memory gate
        run: |
          python -m evals.cli run-memory --output evals/reports/memory-candidate.json
          python -m evals.cli compare --candidate evals/reports/memory-candidate.json --baseline evals/baselines/memory-v1.json

      - name: Run dependency failure-injection gate
        run: python -m evals.cli run-robustness --output evals/reports/robustness-candidate.json

      - name: Build versioned retrieval index
        run: python -m steam_agent.rag.ingest --from-cache

      - name: Run reviewed hybrid retrieval gate
        run: |
          python -m evals.cli run-retrieval --label pr-candidate --output evals/reports/retrieval-candidate.json
          python -m evals.cli compare --candidate evals/reports/retrieval-candidate.json --baseline evals/baselines/retrieval-hybrid-v2.json

      - name: Run paid Agent gate with three repeats
        run: |
          python -m evals.cli run-judge-calibration --output evals/reports/judge-calibration.json
          python -m evals.cli run-personalization --output evals/reports/personalization-candidate.json
          python -m evals.cli compare --candidate evals/reports/personalization-candidate.json --baseline evals/baselines/personalization-v1.json
          python -m evals.cli run-agent --repeats 3 --judge --label pr-candidate --output evals/reports/agent-candidate.json
          python -m evals.cli compare --candidate evals/reports/agent-candidate.json --baseline evals/baselines/agent-v2.1.json
          python -m evals.cli run-agent --dataset evals/datasets/agent_memory.v1.jsonl --repeats 3 --label memory-candidate --output evals/reports/memory-agent-candidate.json
          python -m evals.cli compare --candidate evals/reports/memory-agent-candidate.json --baseline evals/baselines/memory-agent-v2.json

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-quality-reports
          path: |
            evals/reports/*.json
            evals/reports/*.md
            evals/reports/*.xml
            steam_agent/rag/chroma_data/index_manifest.json
          if-no-files-found: warn
