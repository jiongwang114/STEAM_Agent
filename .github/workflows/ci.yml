name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: steam_agent/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r steam_agent/requirements.txt

      - name: Run unit and integration tests
        env:
          DEEPSEEK_API_KEY: test-key
          STEAM_API_KEY: test-key
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate versioned evaluation datasets
        env:
          DEEPSEEK_API_KEY: test-key
          STEAM_API_KEY: test-key
        run: python -m evals.cli validate

      - name: Audit evaluation coverage
        env:
          DEEPSEEK_API_KEY: test-key
          STEAM_API_KEY: test-key
        run: python -m evals.cli audit-coverage --output evals/reports/coverage-ci.json

      - name: Validate ground-truth annotation agreement
        env:
          DEEPSEEK_API_KEY: test-key
          STEAM_API_KEY: test-key
        run: python -m evals.cli run-annotation-agreement --output evals/reports/agreement-ci.json

      - name: Run deterministic memory quality gate
        env:
          DEEPSEEK_API_KEY: test-key
          STEAM_API_KEY: test-key
        run: |
          python -m evals.cli run-memory --output evals/reports/memory-ci.json
          python -m evals.cli compare --candidate evals/reports/memory-ci.json --baseline evals/baselines/memory-v1.json

      - name: Run dependency failure-injection gate
        env:
          DEEPSEEK_API_KEY: test-key
          STEAM_API_KEY: test-key
        run: python -m evals.cli run-robustness --output evals/reports/robustness-ci.json

      - name: Run Agent state and concurrency stress gate
        env:
          DEEPSEEK_API_KEY: test-key
          STEAM_API_KEY: test-key
        run: python -m evals.cli run-stress --output evals/reports/stress-ci.json

      - name: Compile Python sources
        run: python -m compileall -q steam_agent evals tests
