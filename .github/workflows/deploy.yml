name: Deploy Steam Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile application modules
        run: python -m compileall -q api graph memory rag tools
      - name: Check tracked Markdown links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          missing = []
          for path in Path('docs').glob('*.md'):
              for target in re.findall(r'\]\(([^)#]+)', path.read_text(encoding='utf-8')):
                  if '://' in target or target.startswith('#'):
                      continue
                  if not (path.parent / target).exists():
                      missing.append(f'{path}: {target}')
          if missing:
              raise SystemExit('\n'.join(missing))
          PY
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '*.db' --exclude '*.db-shm' --exclude '*.db-wal' \
            --exclude '*.sqlite3' --exclude '*.sqlite3-shm' --exclude '*.sqlite3-wal' \
            --exclude 'rag/chroma_data/' \
            --exclude 'test-artifacts/' --exclude 'tests/' \
            --exclude '.git/' --exclude '.venv/' --exclude '__pycache__/' \
            --exclude '*.pyc' --exclude 'logs/' \
            -e "ssh -p ${DEPLOY_PORT}" ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Restart Docker service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "${DEPLOY_PATH}" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$1"
          cd "$APP_PATH"
          test -f .env
          docker rm -f steam-agent-new2 2>/dev/null || true
          docker stop steam-agent-old 2>/dev/null || true
          docker rename steam-agent steam-agent-old 2>/dev/null || true
          docker run -d --name steam-agent-new2 --restart unless-stopped \
            -p 8000:8000 --env-file "$APP_PATH/.env" \
            -v "$APP_PATH:/app" -w /app steam-agent:github python -m api.main
          if ! docker inspect --format='{{.State.Running}}' steam-agent-new2 | grep -q true; then
            docker start steam-agent-old 2>/dev/null || true
            exit 1
          fi
          REMOTE

      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          for attempt in $(seq 1 30); do
            if ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "curl --fail --silent --show-error http://127.0.0.1:8000/health"; then
              if ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "curl --fail --silent --show-error http://127.0.0.1:8000/ready"; then
                exit 0
              fi
            fi
            sleep 10
          done
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "docker rm -f steam-agent-new2 2>/dev/null || true; docker start steam-agent-old 2>/dev/null || true"
          echo 'Deployment did not become ready; previous container was restored.' >&2
          exit 1
